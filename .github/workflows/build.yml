name: Build Mesa Turnip Driver

on:
  push:
    tags:
      - '*'
  pull_request:
    branches:
      - stable
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Turnip Driver
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            lld \
            llvm \
            ccache \
            ninja-build \
            patchelf \
            unzip \
            curl \
            flex \
            bison \
            zip \
            glslang-tools \
            pkg-config \
            python3 \
            python3-pip \
            python3-mako \
            python3-yaml
          pip3 install --upgrade --break-system-packages meson mako packaging pyyaml

      - name: Extract Mesa Version
        id: get_version
        run: |
          VERSION=$(grep '^mesa_version=' build-turnip.sh | cut -d'"' -f2)
          SDK=$(grep '^sdkver=' build-turnip.sh | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "sdk=$SDK" >> $GITHUB_OUTPUT

      - name: Run Turnip Build Script
        run: |
          bash build-turnip.sh

      - name: Upload Driver Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-Driver-Artifacts
          path: |
            turnip_workdir/Turnip-*.zip
            turnip_workdir/vulkan.turnip.so
            turnip_workdir/meson_log
            turnip_workdir/ninja_log
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: MESA-Turnip-${{ steps.get_version.outputs.version }}
          body: |
            ## KernelSU, Magisk and APatch supported
            ## Android 13 (SDK ${{ steps.get_version.outputs.sdk }}) and above required to install

            * ✅ **Turnip (Vulkan driver)** upgraded to **Mesa ${{ steps.get_version.outputs.version }}**, synced with latest upstream changes.
            * ⚡ Continued **performance improvements** and **bug fixes** for various Vulkan games and applications.
            * 🎮 Enhanced compatibility and support for newer **Qualcomm Adreno GPUs**.
            * 🧩 Additional tuning for Android-specific driver quirks and rendering edge cases.
            * 🚀 Optimized **GPU Cache Cleaner** into single-pass targeted traversal (prevents installer freezes).
            * 🛡️ Fixed SELinux context for vendor HAL (`same_process_hal_file`).
            * 📱 **Android 13 support** - built against platform SDK ${{ steps.get_version.outputs.sdk }} (still runs on 14/15/16).
            * 🔁 **Runtime driver switching** - installs as `vulkan.turnip.so` beside the stock driver; tap the module's action button to switch Turnip ↔ stock without reflashing. The choice survives reboots.

            ---

            ## 🛠️ Build Info
            * 🧼 All binaries **stripped using `llvm-strip`** to reduce size and remove debug info.
            * ⚙️ Compiled using **Android NDK r30**, target API **${{ steps.get_version.outputs.sdk }}**.

            ---

            ## 🤝 Credits
            * **Build & Maintenance:** [**v3kt0r-87 (Shankar Vallabhan)**](https://github.com/v3kt0r-87)
            * **Telegram:** [@VEKTOR_87](https://t.me/VEKTOR_87)
            * **Community Group:** [adreno_driver](https://t.me/adreno_driver_support_group)
          files: |
            turnip_workdir/Turnip-*.zip
            turnip_workdir/vulkan.turnip.so
